name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flux88
          POSTGRES_PASSWORD: flux88_local_dev
          POSTGRES_DB: flux88
        ports:
          - 5488:5432
        options: >-
          --health-cmd "pg_isready -U flux88 -d flux88"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6388:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://flux88:flux88_local_dev@localhost:5488/flux88
      REDIS_URL: redis://localhost:6388
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shared agent skills
        run: |
          python3 scripts/sync-agent-skills.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Migrate and seed database
        run: pnpm --filter @flux88/db db:migrate && pnpm --filter @flux88/db db:seed

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm -r --workspace-concurrency=1 --if-present test:integration

      - name: Install Playwright Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Failure and restart harness tests
        run: pnpm --dir e2e exec playwright test tests/failure-harness.spec.ts tests/restart.spec.ts adversarial/injection.spec.ts --workers=1 --reporter=line
