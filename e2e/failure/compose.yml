services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flux88
      POSTGRES_PASSWORD: ${FAILURE_TEST_PG_PASSWORD:?required}
      POSTGRES_DB: flux88_failure
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux88 -d flux88_failure"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
